<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home | Connectly</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="home"><div id="nav"></div><main class="container mt-4">
<div id="hero" class="carousel slide mb-4" data-bs-ride="carousel"><div class="carousel-inner rounded-3">
 <div class="carousel-item active"><img src="https://picsum.photos/seed/b1/1200/300" class="d-block w-100" alt=""><div class="carousel-caption"><h4>Welcome to Connectly</h4><p>Share moments with people who matter.</p></div></div>
 <div class="carousel-item"><img src="https://picsum.photos/seed/b2/1200/300" class="d-block w-100" alt=""><div class="carousel-caption"><h4>Featured: Community Meetup</h4><p>Saturday, 6 PM. Join the Web Developers group.</p></div></div>
 <div class="carousel-item"><img src="https://picsum.photos/seed/b3/1200/300" class="d-block w-100" alt=""><div class="carousel-caption"><h4>New: Group chats</h4><p>Create a group from Messages.</p></div></div>
</div><button class="carousel-control-prev" data-bs-target="#hero" data-bs-slide="prev" aria-label="Previous"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" data-bs-target="#hero" data-bs-slide="next" aria-label="Next"><span class="carousel-control-next-icon"></span></button></div>
<div class="row"><div class="col-lg-8">
 <form id="postForm" class="card mb-3"><div class="card-body">
  <textarea id="postText" class="form-control mb-2" rows="2" placeholder="What's on your mind?"></textarea>
  <div class="d-flex justify-content-between"><input id="postFile" type="file" class="form-control form-control-sm w-auto" accept="image/*,video/*"><button class="btn btn-brand">Post</button></div>
 </div></form>
 <div id="feed"></div></div>
 <div class="col-lg-4"><div class="card"><div class="card-header bg-white fw-bold">Trending topics</div><ul id="trends" class="list-group list-group-flush"></ul></div></div></div>
</main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
