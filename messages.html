<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages | Connectly</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="messages"><div id="nav"></div><main class="container mt-4">
<div class="row"><div class="col-md-4 mb-3"><div class="card"><div class="card-header bg-white d-flex justify-content-between align-items-center fw-bold">Conversations<button id="newGroup" class="btn btn-sm btn-brand"><i class="bi bi-people"></i> New group</button></div><div id="chats" class="list-group list-group-flush chat-list"></div></div></div>
<div class="col-md-8"><div class="card"><div id="chatTitle" class="card-header bg-white fw-bold"></div><div id="box" class="chat-box"></div>
<form id="sendForm" class="card-footer bg-white input-group"><input id="msgIn" class="form-control" placeholder="Type a message" autocomplete="off"><button class="btn btn-brand"><i class="bi bi-send"></i> Send</button></form></div></div></div>
</main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
