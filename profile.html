<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile | Connectly</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="profile"><div id="nav"></div><main class="container mt-4">
<div class="card mb-4"><img class="cover" src="https://picsum.photos/seed/cover/1200/300" alt="Cover photo">
 <div class="card-body d-flex flex-wrap align-items-end gap-3"><img id="pAvatar" class="avatar avatar-lg" alt="Profile picture">
  <div class="flex-grow-1"><h3 id="pName" class="mb-0"></h3><p id="pBio" class="text-muted mb-0"></p></div>
  <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil"></i> Edit profile</button></div></div>
<div class="row"><div class="col-lg-4 mb-3"><div class="card"><div class="card-header bg-white fw-bold">Friends</div><div class="card-body"><div id="pFriends" class="row"></div></div></div></div>
 <div class="col-lg-8"><h5>Posts</h5><div id="pPosts"></div></div></div>
<div class="modal fade" id="editModal" tabindex="-1"><div class="modal-dialog"><form id="editForm" class="modal-content">
 <div class="modal-header"><h5 class="modal-title">Edit profile</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
 <div class="modal-body"><label class="form-label" for="eName">Name</label><input id="eName" class="form-control mb-3"><label class="form-label" for="eBio">Bio</label><textarea id="eBio" class="form-control" rows="3"></textarea></div>
 <div class="modal-footer"><button class="btn btn-brand">Save changes</button></div></form></div></div>
</main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script></body></html>
